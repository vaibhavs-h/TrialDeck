# Forge manifest. Verify module names/syntax against current Forge docs before changing.
# NOTE: app.id is created by `forge register` (run once by the app owner).
modules:
  jira:issuePanel:
    - key: deviation-panel
      title: Protocol Deviation
      resource: panel
      render: native # UI Kit
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resolver:
        function: resolver
  jira:globalPage:
    - key: trial-dashboard
      title: Trial Dashboard
      resource: dashboard # Custom UI (React + Vite)
      resolver:
        function: resolver
  # Week 4-5: add rovo:agent, action modules here.
  function:
    - key: resolver
      handler: backend/index.handler
resources:
  - key: panel
    path: frontend/panel/index.jsx
  - key: dashboard
    path: frontend/dashboard/dist
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:page:confluence
  content:
    styles:
      - unsafe-inline # needed by recharts inline styles; revisit
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/9849cd64-8b47-4814-9199-4c4fd1985d15
