# Forge manifest. Verify module names/syntax against current Forge docs before changing.
# NOTE: app.id is created by `forge register` (run once by the app owner).
modules:
  jira:issuePanel:
    - key: deviation-panel
      title: Protocol Deviation
      resource: panel
      render: native # UI Kit
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resolver:
        function: resolver
  jira:globalPage:
    - key: trial-dashboard
      title: Trial Dashboard
      resource: dashboard # Custom UI (React + Vite)
      resolver:
        function: resolver
  rovo:agent:
    - key: deviation-reporter
      name: Deviation Reporter
      description: Drafts a structured protocol deviation report from a Jira deviation ticket. A human reviews before anything is saved.
      conversationStarters:
        - Draft a report for this deviation
        - Draft a report for deviation <issue key>
      actions:
        - get-deviation
        - save-report-draft
        - find-similar-deviations
      prompt: >
        You are the Deviation Reporter for clinical trial teams.
        Your job: draft a structured protocol deviation report from a Jira ticket.

        Workflow:
        1. Ask for the issue key if the user did not give one. Call get-deviation.
        2. Call find-similar-deviations using the site or root cause from the ticket.
           If similar deviations are found, cite their keys and brief summaries in a
           "Related Historical Deviations" section. If none found, state "No similar deviation found".
        3. Write the report with exactly these sections:
           What happened / Impact (subject safety and data integrity) /
           Root cause / Corrective action / Preventive action / Related Historical Deviations.
        4. Use ONLY facts returned by get-deviation and find-similar-deviations. After each fact, cite
           the issue key and the field or comment it came from.
        5. If a section has no information, write "Not stated in ticket".
           Never invent dates, names, numbers or causes.
        6. Never include real patient names. Use only the pseudonymized subject ID.
        7. Show the draft and ask: "Reply APPROVE to save this draft to the ticket."
        8. Call save-report-draft ONLY after the user explicitly replies APPROVE in the current conversation.
        9. The saved text must start with "AI DRAFT (human-approved)".
        Keep wording plain and short.
    - key: amendment-analyst
      name: Amendment Analyst
      description: Compares protocol page versions in Confluence, extracts changes, and creates per-site Jira tasks upon approval.
      conversationStarters:
        - List available protocol pages
        - Analyze amendment between version 1 and 2
      actions:
        - list-protocol-pages
        - analyze-amendment
        - preview-site-tasks
        - create-site-tasks
      prompt: >
        You are the Amendment Analyst for clinical trial operations.
        Your job: analyze Confluence protocol amendments and prepare per-site rollout tasks.

        Workflow:
        1. If user has not specified a page or versions, call list-protocol-pages to guide them.
        2. Always call analyze-amendment first to compare the two versions. Group changes by:
           Eligibility, Schedule/Visit Windows, Dosing, Safety, and Consent.
        3. Cite the exact source sentence for every single change. Never invent changes.
        4. Call preview-site-tasks to simulate required site tasks (re-consent, IRB approval, retraining).
        5. Present the summary and task preview to the user.
        6. Ask: "Reply APPROVE to create these tasks in Jira."
        7. Call create-site-tasks ONLY after the user explicitly replies APPROVE in the current conversation.
        8. If create-site-tasks returns remaining > 0, inform the user:
           "Created batch of tasks. N tasks remaining. Reply APPROVE again to create the next batch."
        Keep wording precise and clinical.
  action:
    - key: get-deviation
      name: Get deviation
      function: get-deviation-fn
      actionVerb: GET
      description: Reads a Jira protocol deviation ticket (fields, description, comments) by issue key. (Read-only)
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key, for example TRIAL-12
    - key: save-report-draft
      name: Save report draft
      function: save-report-draft-fn
      actionVerb: CREATE
      description: Saves an approved deviation report draft as a comment on the Jira ticket. WRITES TO JIRA. Call ONLY after user explicitly replies APPROVE.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira issue key
        reportText:
          title: Report text
          type: string
          required: true
          description: The full approved report text
    - key: find-similar-deviations
      name: Find similar deviations
      function: find-similar-fn
      actionVerb: GET
      description: Searches for earlier deviations on the same site or with similar root causes or summaries. (Read-only)
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Current issue key to exclude from results
        site:
          title: Site
          type: string
          required: false
          description: Trial site identifier (e.g. Site 4)
        rootCause:
          title: Root cause
          type: string
          required: false
          description: Root cause category or keyword
        summary:
          title: Summary
          type: string
          required: false
          description: Summary text to extract search keywords from
    - key: list-protocol-pages
      name: List protocol pages
      function: list-protocol-pages-fn
      actionVerb: GET
      description: Lists Confluence protocol pages available for amendment analysis. (Read-only, max 20 items)
    - key: analyze-amendment
      name: Analyze amendment
      function: analyze-amendment-fn
      actionVerb: GET
      description: Compares two versions of a Confluence protocol page and returns classified changes with source citations. (Read-only, max 20 items)
      inputs:
        pageId:
          title: Page ID
          type: string
          required: false
          description: Confluence page ID (e.g. 123456)
        pageTitle:
          title: Page Title
          type: string
          required: false
          description: Confluence page title
        fromVersion:
          title: From Version
          type: number
          required: true
          description: Prior protocol version number (e.g. 1)
        toVersion:
          title: To Version
          type: number
          required: true
          description: New protocol version number (e.g. 2)
    - key: preview-site-tasks
      name: Preview site tasks
      function: preview-site-tasks-fn
      actionVerb: GET
      description: Previews per-site rollout tasks that would be generated from an amendment diff. (Read-only, max 20 items)
      inputs:
        pageId:
          title: Page ID
          type: string
          required: false
          description: Confluence page ID
        pageTitle:
          title: Page Title
          type: string
          required: false
          description: Confluence page title
        fromVersion:
          title: From Version
          type: number
          required: true
          description: Prior protocol version number
        toVersion:
          title: To Version
          type: number
          required: true
          description: New protocol version number
        effectiveDate:
          title: Effective Date
          type: string
          required: false
          description: Optional target effective date (YYYY-MM-DD)
    - key: create-site-tasks
      name: Create site tasks
      function: create-site-tasks-fn
      actionVerb: CREATE
      description: Creates rollout tasks in Jira for each trial site. WRITES TO JIRA in batches of up to 10. Call ONLY after user explicitly replies APPROVE.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: false
          description: Confluence page ID
        pageTitle:
          title: Page Title
          type: string
          required: false
          description: Confluence page title
        fromVersion:
          title: From Version
          type: number
          required: true
          description: Prior protocol version number
        toVersion:
          title: To Version
          type: number
          required: true
          description: New protocol version number
        effectiveDate:
          title: Effective Date
          type: string
          required: false
          description: Optional target effective date (YYYY-MM-DD)
  function:
    - key: resolver
      handler: backend/index.handler
    - key: get-deviation-fn
      handler: backend/agent.getDeviation
    - key: save-report-draft-fn
      handler: backend/agent.saveReportDraft
    - key: find-similar-fn
      handler: backend/agent.findSimilarDeviations
    - key: list-protocol-pages-fn
      handler: backend/agentAmendment.listProtocolPages
    - key: analyze-amendment-fn
      handler: backend/agentAmendment.analyzeAmendmentAction
    - key: preview-site-tasks-fn
      handler: backend/agentAmendment.previewSiteTasks
    - key: create-site-tasks-fn
      handler: backend/agentAmendment.createSiteTasks
    - key: deviation-pattern-event
      handler: backend/issueEvent.handler
  trigger:
    - key: deviation-pattern-issue-event
      function: deviation-pattern-event
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
resources:
  - key: panel
    path: frontend/panel/index.jsx
  - key: dashboard
    path: frontend/dashboard/dist
permissions:
  scopes:
    - read:jira-work # Read deviations, linked CAPAs, and Jira issue events.
    - write:jira-work # Existing issue and comment resolvers create and update Jira records.
    - read:jira-user # Existing UI resolvers read Jira user and assignee metadata.
    - storage:app # Store field mappings, per-project aggregates, alerts, and audit entries.
    - read:page:confluence # Existing report resolvers read Confluence pages.
  content:
    styles:
      - unsafe-inline # needed by recharts inline styles; revisit
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/9849cd64-8b47-4814-9199-4c4fd1985d15